name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .                # folder that contains your Dockerfile
          file: ./Dockerfile        # change if your Dockerfile is elsewhere
          push: true
          tags: |
            fsafa/shopsphere-app:latest
            fsafa/shopsphere-app:${{ github.sha }}

      # ---------- CD: tell Azure Web App to run the new image ----------
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'shopsphere-app'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: fsafa/shopsphere-app:${{ github.sha }}
