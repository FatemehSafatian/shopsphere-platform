apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingapi-deployment
  labels:
    app: shoppingapi

spec:
  replicas: 1

  selector:
    matchLabels:
      app: shoppingapi

  template:
    metadata:
      labels:
        app: shoppingapi

    spec:
      containers:
        - name: shoppingapi
          image: fsafa/shopsphere-api:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"

            - name: ASPNETCORE_URLS
              value: "http://+:8080"

            - name: DatabaseSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-connection-string

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: shoppingapi-service

spec:
  type: NodePort

  selector:
    app: shoppingapi

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8080
      nodePort: 31000
