apiVersion : apps/v1
kind: Deployment
metadata:
  name: shopsphereapi 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopsphereapi
  template:
    metadata:
      labels:
        app: shopsphereapi 
    spec:
      containers:
        - name: shopsphereapi 
          image: shopsphereacrfs.azurecr.io/shopsphereapi
          ports:
          - containerPort: 8080